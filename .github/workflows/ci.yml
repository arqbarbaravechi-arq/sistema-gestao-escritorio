name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: sistema_gestao_arquitetura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Rodar migrations (banco de teste)
        run: npm run db:migrate --workspace=packages/database
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/sistema_gestao_arquitetura_test

      - name: Build
        run: npm run build

      - name: Testes
        run: npm run test
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/sistema_gestao_arquitetura_test

  deploy-staging:
    needs: lint-build-test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy em staging
        run: echo "Placeholder — conectar ao provedor de hospedagem (Railway/Render/Vercel) na E2 da Sprint 0"
